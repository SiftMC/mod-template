name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.0.0. Empty picks it from the commits since the last tag.
      dry-run:
        description: Build and check the upload, but publish nothing.
        type: boolean

permissions:
  contents: write

# A second click waits for the running release, then sees its tag.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gradle/actions/setup-gradle@v5
      - env:
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry-run && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: bash .github/release.sh
