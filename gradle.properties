# Mod. Write a letter outside ASCII as its \u escape, for example \u00fc for the letter u with umlaut.
mod_id=examplemod
mod_name=Example Mod
mod_version=0.0.0
mod_group=com.example
mod_author=SiftMC
mod_description=A multiloader mod.
mod_license=MIT

# Minecraft versions and loader versions are in stonecutter.properties.toml.

# Publishing. A platform gets every release jar once its project id is set here.
modrinth_id=
curseforge_id=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: one output folder for classes and resources, so Forge finds the mod in dev runs
net.minecraftforge.gradle.merge-source-sets=true
# Stonecutter: no IDE run configuration per version switch. The switch tasks stay.
dev.kikugie.stonecutter.generate_switch_actions=false
